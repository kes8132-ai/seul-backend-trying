<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 담벼락</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📌</text></svg>">
  <style>
    body { font-family: sans-serif; margin: 20px; }
    h1 { font-size: 24px; }
    .notice { background: #ffe9e9; padding: 10px; }

    /* 로그인 버튼이 들어올 자리 */
    #userArea { margin: 12px 0; color: #555; display: flex; align-items: center; gap: 8px; font-size: 15px; }
    #userArea button { padding: 5px 12px; font-size: 14px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: #fff; }
    #userArea button:hover { background: #f0f0f0; }

    /* 메모 쓰는 칸 */
    #writer { margin: 16px 0; }
    #writer textarea { width: 400px; font-size: 16px; }

    /* 메모가 붙는 담벼락 */
    #wall { display: flex; flex-wrap: wrap; gap: 10px; }
    .memo { border: 1px solid #ddd; background: #fffde7; padding: 10px; width: 200px; font-size: 15px; border-radius: 4px; box-shadow: 1px 1px 4px rgba(0,0,0,0.05); }
    .memo button { float: right; border: none; background: transparent; cursor: pointer; font-size: 16px; color: #999; }
    .memo button:hover { color: #f44336; font-weight: bold; }
    .memo .author { margin-top: 8px; font-size: 12px; color: #888; text-align: right; }

    /* AI 코멘트 스타일 */
    .memo .ai-comment {
      margin-top: 10px;
      padding: 8px;
      background: #f1f8e9;
      border-radius: 6px;
      border-left: 3px solid #7cb342;
      font-size: 13px;
      color: #33691e;
      line-height: 1.4;
      word-break: break-word;
    }
    .memo .ai-comment-header {
      font-weight: bold;
      font-size: 11px;
      margin-bottom: 4px;
      color: #558b2f;
    }
    .memo .btn-ai {
      margin-top: 8px;
      padding: 4px 8px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid #c5e1a5;
      background: #f9fbe7;
      color: #33691e;
      cursor: pointer;
      display: block;
      width: 100%;
      text-align: center;
    }
    .memo .btn-ai:hover {
      background: #f1f8e9;
    }
    #userArea .btn-batch-ai {
      background: #7c4dff;
      color: #fff;
      border: none;
      padding: 5px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    #userArea .btn-batch-ai:hover {
      background: #651fff;
    }
  </style>
</head>
<body>

  <h1>우리 반 담벼락</h1>

  <!-- 백엔드 1: Firestore 연동으로 저장 기능이 활성화되었습니다 -->

  <!-- 백엔드 2 시간에 여기에 로그인 버튼과 내 이름이 들어옵니다 -->
  <div id="userArea">아직 로그인 기능이 없습니다.</div>

  <div id="writer">
    <textarea id="input" rows="3" placeholder="메모를 쓰고 엔터"></textarea>
  </div>

  <!-- 메모는 app.js가 그립니다 -->
  <div id="wall"></div>

  <!--
    type="module" 로 불러옵니다.
    Firebase SDK가 import 문법이라, 백엔드 시간에 이 방식이어야 붙일 수 있습니다.
  -->
  <script type="module" src="app.js"></script>
</body>
</html>
